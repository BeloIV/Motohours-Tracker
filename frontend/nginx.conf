# Traffic from the internet arrives cloudflared -> NPM -> docker gateway, so
# only addresses from the docker ranges may tell us the client IP / scheme.
# Direct LAN/VPN clients keep their own address and cannot spoof either.
set_real_ip_from 172.16.0.0/12;
real_ip_header   CF-Connecting-IP;

geo $realip_remote_addr $from_trusted_proxy {
    default        0;
    172.16.0.0/12  1;
}
map $from_trusted_proxy $forwarded_proto {
    1       $http_x_forwarded_proto;
    default $scheme;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 6m;       # vehicle photos: 5 MB limit in multer
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Brute-force brake in front of the backend's own login limiter. Burst
    # covers a shift change where several people log in from one network.
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        error_page 429 = @too_many;   # nginx's own 429 is HTML; the SPA reads JSON
        proxy_pass http://backend:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Replaces the Vite dev proxy: one origin for app and API.
    location /api/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location @too_many {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 429 '{"error":"Príliš veľa pokusov, skúste to neskôr"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
