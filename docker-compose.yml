version: '3.8'
services:
  database:
    build:
      context: ./database
    container_name: motohours-postgres
    # No published port: reachable only on the compose network.
    environment:
      - POSTGRES_DB=motohours_db
      - POSTGRES_USER=motohours_user
      - POSTGRES_PASSWORD=motohours_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motohours_user -d motohours_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: motohours-backend
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - FRONTEND_URL=http://192.168.1.250:5002
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=motohours_db
      - DB_USER=motohours_user
      - DB_PASSWORD=motohours_password
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: motohours-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5002:5002"
    environment:
      - BACKEND_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: 