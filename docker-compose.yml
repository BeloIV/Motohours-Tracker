# Production: nginx serves the built SPA on :5002 and proxies /api and /uploads
# to the backend, which is not published. Secrets come from .env:
#   scripts/set-jwt-secret.sh         (JWT_SECRET)
#   scripts/rotate-db-credentials.sh  (DB_USER / DB_PASSWORD / POSTGRES_PASSWORD)
# Hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  database:
    build:
      context: ./database
    container_name: motohours-postgres
    # No published port. For ad-hoc access:
    #   docker compose exec database psql -U motohours_user motohours_db
    environment:
      - POSTGRES_DB=motohours_db
      - POSTGRES_USER=motohours_user
      # Only read when the volume is first initialised
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-motohours_password}
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker
      - postgres18_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motohours_user -d motohours_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: motohours-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?run scripts/set-jwt-secret.sh}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=motohours_db
      - DB_USER=${DB_USER:-motohours_user}
      - DB_PASSWORD=${DB_PASSWORD:-motohours_password}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: motohours-tracker-frontend
    container_name: motohours-frontend
    ports:
      - "5002:80"
    depends_on:
      - backend
    restart: unless-stopped

# Pinned: nginx trusts CF-Connecting-IP / X-Forwarded-Proto only from 172.16.0.0/12
networks:
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  postgres18_data:
  uploads_data:
