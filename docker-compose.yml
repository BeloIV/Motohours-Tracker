version: '3.8'
services:
  database:
    build:
      context: ./database
    container_name: motohours-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=motohours_db
      - POSTGRES_USER=motohours_user
      - POSTGRES_PASSWORD=motohours_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: motohours-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - FRONTEND_URL=http://localhost:5000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=motohours_db
      - DB_USER=motohours_user
      - DB_PASSWORD=motohours_password
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: motohours-frontend
    ports:
      - "5000:5000"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: 